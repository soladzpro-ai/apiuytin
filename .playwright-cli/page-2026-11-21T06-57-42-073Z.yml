      - article [ref=e29]:
        - generic [ref=e30]:
          - heading [level=1] [ref=e31]:
            - text: Chính sách bảo mật
            - emphasis [ref=e32]: Minh bạch & Chuẩn mực.
          - paragraph [ref=e33]: Tại APIUYTIN, chúng tôi coi trọng sự riêng tư và bảo mật dữ liệu của nhà phát triển cũng như người dùng cuối. Chính sách này mô tả chi tiết cách thức chúng tôi thu thập, xử lý, mã hóa và bảo vệ dữ liệu khi bạn sử dụng nền tảng hạ tầng xác thực danh tính của chúng tôi.
          - generic [ref=e34]:
            - generic [ref=e35]: Phiên bản có hiệu lực
            - code [ref=e36]: "v2.4 — Ngày cập nhật: 12/09/2026"
        - generic [ref=e37]:
          - heading "Dữ liệu chúng tôi thu thập" [level=2] [ref=e38]
          - paragraph [ref=e39]: "APIUYTIN chỉ thu thập những thông tin tối thiểu cần thiết để vận hành giao thức xác thực OAuth 2.0 và quản lý thông tin xác thực dự án của bạn:"
          - generic [ref=e40]:
            - article [ref=e41]:
              - generic [ref=e42]:
                - heading "Tài khoản Google" [level=3] [ref=e43]
                - generic [ref=e44]: Google OAuth 2.0
              - paragraph [ref=e45]: Bao gồm họ tên hiển thị, địa chỉ email và ảnh đại diện (avatar) từ Google để thiết lập danh tính nội bộ. Mã định danh Google (Google Subject ID) chỉ được dùng phía máy chủ để liên kết tài khoản, không trả trực tiếp cho website tích hợp.
            - article [ref=e46]:
              - generic [ref=e47]:
                - heading "Dự án Tích hợp" [level=3] [ref=e48]
                - generic [ref=e49]: Nhà phát triển
              - paragraph [ref=e50]: Bao gồm tên định danh ứng dụng, URL callback trực tiếp chính xác và dấu thời gian khởi tạo để phân quyền.
            - article [ref=e51]:
              - generic [ref=e52]:
                - heading "Khóa Credential" [level=3] [ref=e53]
                - generic [ref=e54]: Hệ thống sinh
              - paragraph [ref=e55]:
                - text: Bao gồm Client ID (
                - code [ref=e56]: pk_...
                - text: ), hash của API key (
                - code [ref=e57]: CHUOTAPI_...
                - text: ) và hồ sơ APIUYTIN đã được người dùng đồng ý chia sẻ.
            - article [ref=e58]:
              - generic [ref=e59]:
                - heading "Nhật ký Truy cập" [level=3] [ref=e60]
                - generic [ref=e61]: Cloudflare Edge
              - paragraph [ref=e62]: Địa chỉ IP ẩn danh, User-Agent và mã trạng thái HTTP nhằm phục vụ công tác chống tấn công từ chối dịch vụ (DDoS).
        - generic [ref=e63]:
          - heading "Mục đích sử dụng dữ liệu" [level=2] [ref=e64]
          - paragraph [ref=e65]: "Dữ liệu được xử lý nhằm các mục đích cụ thể và hợp pháp sau đây:"
          - list [ref=e66]:
            - listitem [ref=e67]: Xác thực danh tính nhà phát triển khi đăng nhập bảng điều khiển API.
            - listitem [ref=e68]: Cấp phát và quản lý vòng đời bộ khóa xác thực độc quyền cho từng dự án.
            - listitem [ref=e69]: Đối soát tính chính xác tuyệt đối của Callback URL trong quá trình trao đổi Authorization Code.
            - listitem [ref=e70]: Cung cấp endpoint Userinfo cho phép máy chủ ứng dụng của bạn lấy hồ sơ người dùng đã được ủy quyền.
            - listitem [ref=e71]: Giám sát độ ổn định hạ tầng và phát hiện kịp thời các hành vi lạm dụng, thử nhiều token tự động.
            - listitem [ref=e72]: Tuyệt đối KHÔNG sử dụng dữ liệu cho mục đích quảng cáo hoặc tiếp thị của bên thứ ba.
        - generic [ref=e73]:
          - heading "Tiêu chuẩn mã hóa & Lưu trữ an toàn" [level=2] [ref=e74]
          - paragraph [ref=e75]: "Toàn bộ kiến trúc dữ liệu của APIUYTIN tuân thủ các nguyên tắc mật mã học hiện đại (Zero-Trust & Cryptographic Randomness):"
          - generic [ref=e76]:
            - strong [ref=e77]: "Bảo vệ API key một lần duy nhất (chỉ trả văn bản gốc một lần):"
            - text: API key (
            - code [ref=e78]: CHUOTAPI_...
            - text: ) chỉ được trả về dưới dạng văn bản gốc lúc khởi tạo hoặc cấp lại dự án. Sanity chỉ lưu chuỗi băm mật mã; khi mất key, chủ sở hữu phải cấp lại key mới.
          - generic [ref=e79]:
            - strong [ref=e80]: "Giao thức truyền tải bắt buộc:"
            - text: Toàn bộ lưu lượng truy cập tới các endpoint
            - code [ref=e81]: /api/auth/*
            - text: và
            - code [ref=e82]: /oauth/google/*
            - text: đều được mã hóa bằng TLS 1.3 qua mạng biên toàn cầu của Cloudflare. Mọi kết nối không sử dụng HTTPS sẽ bị từ chối tự động.
        - generic [ref=e83]:
          - heading "Google API & Nhà cung cấp hạ tầng" [level=2] [ref=e84]
          - paragraph [ref=e85]: "Hệ thống tích hợp chặt chẽ với các đối tác hạ tầng uy tín toàn cầu:"
          - generic [ref=e86]:
            - article [ref=e87]:
              - heading "Google Identity Services" [level=3] [ref=e88]
              - paragraph [ref=e89]:
                - text: Tuân thủ nghiêm ngặt
                - emphasis [ref=e90]: Chính sách dữ liệu người dùng của Google API Services
                - text: và yêu cầu Limited Use. Dữ liệu Google OAuth chỉ dùng để xác thực và tạo phiên.
              - code [ref=e91]: google.com/policies/privacy
            - article [ref=e92]:
              - heading "Cloudflare Pages & Workers" [level=3] [ref=e93]
              - paragraph [ref=e94]: Cung cấp môi trường thực thi serverless edge cách ly hoàn toàn, tích hợp tường lửa bảo vệ DDoS và chứng chỉ SSL tự động.
              - code [ref=e95]: cloudflare.com/privacypolicy
            - article [ref=e96]:
              - heading "Sanity Content Lake" [level=3] [ref=e97]
              - paragraph [ref=e98]: Hệ thống lưu trữ cơ sở dữ liệu đám mây chuẩn doanh nghiệp, tuân thủ SOC 2 Type II và GDPR để lưu trữ bản ghi metadata có kiểm soát.
              - code [ref=e99]: sanity.io/legal/privacy
            - article [ref=e100]:
              - heading "Nguyên tắc không bán dữ liệu" [level=3] [ref=e101]
              - paragraph [ref=e102]: Chúng tôi cam kết không bán, không cho thuê, không chia sẻ bất kỳ thông tin cá nhân hay thông tin xác thực nào cho bên thứ ba vì lợi ích thương mại.
              - code [ref=e103]: Strict Non-Disclosure Guarantee
