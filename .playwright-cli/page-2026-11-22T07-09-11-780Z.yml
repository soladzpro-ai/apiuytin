        - paragraph [ref=f5e397]: "Đoạn dưới đây minh họa thứ tự xử lý. Tên hàm lưu session có thể khác tùy framework, nhưng thứ tự kiểm tra thì không nên đổi: đọc lỗi, kiểm tra state, xóa state, rồi mới đổi code."
        - code [ref=f5e399]: "app.get(\"/auth/apiuytin/callback\", async (req, res, next) => { try { const { code, state, error } = req.query; const saved = req.session.apiuytinStates?.[state]; // State không có trong session nghĩa là callback lạ hoặc đã dùng. if (!state || !saved || Date.now() - saved.createdAt > 10 * 60 * 1000) { return res.status(400).send(\"Phiên đăng nhập không hợp lệ hoặc đã hết hạn.\"); } // Xóa trước khi gọi mạng để một lần callback chỉ được dùng một lần. delete req.session.apiuytinStates[state]; await saveSession(req); if (error) { if (error === \"access_denied\") return res.redirect(\"/login?cancelled=1\"); return res.status(400).send(\"Đăng nhập chưa hoàn tất. Hãy thử lại từ nút đăng nhập.\"); } if (typeof code !== \"string\" || !code) { return res.status(400).send(\"Callback không có authorization code.\"); } // Chỉ máy chủ được thực hiện bước này vì body có API key. const token = await exchangeApiuytinCode(code); req.session.user = await findOrCreateLocalUser(token.user); await saveSession(req); return res.redirect(saved.returnTo || \"/account\"); } catch (error) { return next(error); } });"
        - paragraph [ref=f5e400]:
          - text: Trong ví dụ này,
          - code [ref=f5e401]: saveSession
          - text: ","
          - code [ref=f5e402]: exchangeApiuytinCode
          - text: và
          - code [ref=f5e403]: findOrCreateLocalUser
          - text: là hàm của website tích hợp. APIUYTIN không cung cấp các hàm này; bạn viết chúng theo thư viện session và database của mình.
