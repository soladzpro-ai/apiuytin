        - list [ref=f5e612]:
          - listitem [ref=f5e613]: Không retry lỗi 4xx mà không đổi input hoặc trạng thái.
          - listitem [ref=f5e614]: Không thử lại mù POST token bằng cùng code sau khi hết thời gian chờ; authorization code là code dùng một lần.
