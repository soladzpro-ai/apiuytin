        - heading "2. Tạo và đăng nhập tài khoản APIUYTIN" [level=3] [ref=f5e86]
        - list [ref=f5e87]:
          - listitem [ref=f5e88]:
            - strong [ref=f5e89]: Nếu chưa có tài khoản, mở trang Đăng ký.
            - paragraph [ref=f5e90]: Nhập tên tài khoản dài 3–32 ký tự, nhập mật khẩu tối thiểu 8 ký tự và nhập lại mật khẩu. Bấm biểu tượng con mắt nếu cần kiểm tra nội dung đang nhập. Khi mật khẩu đang hiện, biểu tượng là mắt mở; bấm lần nữa để ẩn lại.
          - listitem [ref=f5e91]:
            - strong [ref=f5e92]: Chọn cách tạo tài khoản phù hợp.
            - paragraph [ref=f5e93]: Bạn có thể tạo tài khoản APIUYTIN bằng tên tài khoản và mật khẩu. Bạn cũng có thể bấm nút Google để xác thực Google và tạo hoặc cập nhật tài khoản APIUYTIN tương ứng. Google không phải là thông tin đăng nhập mà website tích hợp nhận được.
          - listitem [ref=f5e94]:
            - strong [ref=f5e95]: Đăng nhập bằng tài khoản đã tạo.
            - paragraph [ref=f5e96]: Trang Đăng nhập chấp nhận đúng tên tài khoản và mật khẩu đã đăng ký. Nếu bạn dùng Google, hãy dùng nút Google để đi qua luồng xác thực Google. Sau khi thành công, website tạo phiên dashboard riêng bằng cookie HttpOnly.
          - listitem [ref=f5e97]:
            - strong [ref=f5e98]: Không gửi mật khẩu cho website tích hợp.
            - paragraph [ref=f5e99]: Tên tài khoản và mật khẩu chỉ dùng để xác thực với APIUYTIN. Website bên thứ ba chỉ nhận profile APIUYTIN sau khi người dùng đồng ý trong màn hình OAuth; API key vẫn chỉ dùng ở máy chủ của website tích hợp.
        - heading "3. Bắt đầu từ Home và tạo project" [level=3] [ref=f5e100]
        - list [ref=f5e101]:
          - listitem [ref=f5e102]:
            - strong [ref=f5e103]: Mở Home sau khi đăng nhập.
            - paragraph [ref=f5e104]:
              - text: Thanh bên trái có các khu vực
              - strong [ref=f5e105]: Home
              - text: ","
              - strong [ref=f5e106]: API keys
              - text: ","
              - strong [ref=f5e107]: Người dùng của tôi
              - text: và
              - strong [ref=f5e108]: Tài khoản
              - text: . Mục Home là nơi quay về dashboard; mục API keys là nơi làm việc với project.
          - listitem [ref=f5e109]:
            - strong [ref=f5e110]: Vào API keys và bấm tạo project.
            - paragraph [ref=f5e111]:
              - text: Đặt tên project theo môi trường, ví dụ
              - code [ref=f5e112]: Website production
              - text: hoặc
              - code [ref=f5e113]: Website staging
              - text: . Nên tách production và staging thành hai project để không dùng nhầm callback hoặc API key.
          - listitem [ref=f5e114]:
            - strong [ref=f5e115]: Nhập callback URL chính xác.
            - paragraph [ref=f5e116]:
              - text: Callback phải là HTTPS và phải khớp từng ký tự với URL mà máy chủ website tích hợp dùng. Không thêm slash cuối tùy ý, không dùng fragment
              - code [ref=f5e117]: "#"
              - text: ", username hoặc password trong callback."
          - listitem [ref=f5e118]:
            - strong [ref=f5e119]: Lưu thông tin trả về ngay sau khi tạo.
            - paragraph [ref=f5e120]:
              - text: Project trả ra
              - code [ref=f5e121]: clientId
              - text: để bắt đầu OAuth và API key dạng văn bản chỉ một lần. Lưu API key vào secret manager phía máy chủ ngay lúc này; nếu đóng hộp thoại hoặc làm mất key, hãy dùng chức năng cấp lại key.
        - heading "4. Cho website khác đăng nhập bằng APIUYTIN" [level=3] [ref=f5e122]
        - list [ref=f5e123]:
          - listitem [ref=f5e124]:
            - strong [ref=f5e125]: Website tích hợp bắt đầu tại OAuth.
            - paragraph [ref=f5e126]:
              - text: Máy chủ website tích hợp tạo
              - code [ref=f5e127]: state
              - text: ngẫu nhiên, lưu state vào session của chính website đó rồi chuyển trình duyệt tới
              - code [ref=f5e128]: /oauth/google
              - text: bằng Client ID, callback URL và state.
          - listitem [ref=f5e129]:
            - strong [ref=f5e130]: Người dùng nhìn thấy bộ chọn tài khoản APIUYTIN.
            - paragraph [ref=f5e131]: Nếu thiết bị đã ghi nhớ tài khoản, màn hình hiển thị avatar, tên và email để người dùng chọn. Màn hình cũng cho biết project nào đang yêu cầu đăng nhập, callback domain nào sẽ nhận kết quả và các trường hồ sơ sẽ được chia sẻ.
          - listitem [ref=f5e132]:
            - strong [ref=f5e133]: Dùng tài khoản APIUYTIN bằng mật khẩu nếu cần.
            - paragraph [ref=f5e134]:
              - text: Nếu tài khoản chưa có trên thiết bị, người dùng có thể chọn liên kết
              - strong [ref=f5e135]: Đăng nhập bằng tài khoản APIUYTIN
              - text: ", nhập tên tài khoản và mật khẩu đã tạo ở trang đăng ký. Sau khi xác thực, tài khoản được liên kết với thiết bị và quay lại màn hình đồng ý."
          - listitem [ref=f5e136]:
            - strong [ref=f5e137]: Dùng Google chỉ khi cần xác thực tài khoản.
            - paragraph [ref=f5e138]: Thiết bị mới, thêm tài khoản mới hoặc tài khoản chưa từng được xác thực sẽ chuyển qua Google. Sau lần xác thực đó, tài khoản APIUYTIN được ghi nhớ trên thiết bị cho những lần chọn sau.
          - listitem [ref=f5e139]:
            - strong [ref=f5e140]: Bấm Tiếp tục để đồng ý hoặc Hủy để dừng.
            - paragraph [ref=f5e141]:
              - text: Tiếp tục tạo authorization code dùng một lần rồi chuyển về callback. Hủy không tạo token mà trả
              - code [ref=f5e142]: error=access_denied
              - text: kèm state để website tích hợp kết thúc đúng phiên đăng nhập.
          - listitem [ref=f5e143]:
            - strong [ref=f5e144]: Website tích hợp đổi code ở máy chủ.
            - paragraph [ref=f5e145]: Máy chủ dùng API key để đổi code tại token endpoint. Trình duyệt của website tích hợp không được nhìn thấy API key, không được tự đổi code và không được lưu API key trong localStorage.
        - heading "5. Quản lý project đang hoạt động" [level=3] [ref=f5e146]
        - list [ref=f5e147]:
          - listitem [ref=f5e148]:
            - strong [ref=f5e149]: "Công tắc hiệu lực:"
            - text: bật project để cho phép OAuth, token, userinfo, project-info và allusers hoạt động; tắt project để khóa tạm thời mà không xóa project.
          - listitem [ref=f5e150]:
            - strong [ref=f5e151]: "Cấp lại API key:"
            - text: dùng khi key có nguy cơ bị lộ. Key cũ bị vô hiệu hóa ngay, key mới chỉ hiện một lần. Cập nhật secret manager của website tích hợp ngay sau khi cấp lại.
          - listitem [ref=f5e152]:
            - strong [ref=f5e153]: "Thu hồi project:"
            - text: dùng khi project không còn cần nữa. Project bị vô hiệu hóa ngay; dữ liệu OAuth liên quan có thể được dọn dẹp ở nền, vì vậy không cần chờ màn hình quay mãi.
          - listitem [ref=f5e154]:
            - strong [ref=f5e155]: "Sửa callback:"
            - text: chỉ cập nhật khi máy chủ tích hợp đã sẵn sàng nhận callback mới. Sau khi sửa, các yêu cầu OAuth tiếp theo phải dùng callback mới.
        - heading "6. Xem người dùng và cập nhật danh sách" [level=3] [ref=f5e156]
        - list [ref=f5e157]:
          - listitem [ref=f5e158]:
            - strong [ref=f5e159]: Mở Người dùng của tôi.
            - paragraph [ref=f5e160]: Chọn project trong hộp chọn. Trang gọi endpoint overview tương ứng và hiển thị tên, email, avatar và thời điểm đăng nhập gần nhất của các tài khoản đã dùng project.
          - listitem [ref=f5e161]:
            - strong [ref=f5e162]: Bấm Làm mới khi muốn xem ngay.
            - paragraph [ref=f5e163]: Nút Làm mới tải lại danh sách mà không cần tải lại toàn bộ trang. Trong lúc chờ, nút chuyển sang trạng thái đang cập nhật để tránh gửi nhiều yêu cầu trùng nhau.
          - listitem [ref=f5e164]:
            - strong [ref=f5e165]: Theo dõi bộ đếm tự động.
            - paragraph [ref=f5e166]: Trang tự polling mỗi 60 giây khi tab đang hiển thị. Bộ đếm cho biết còn bao nhiêu giây tới lần cập nhật tiếp theo. Khi chuyển sang tab khác, trang tạm dừng polling để không tạo request nền không cần thiết.
        - heading "7. Tài liệu, giao diện và các thao tác nhỏ" [level=3] [ref=f5e167]
        - list [ref=f5e168]:
          - listitem [ref=f5e169]:
            - strong [ref=f5e170]: "Tải hướng dẫn Markdown:"
            - text: trong phần đầu trang tài liệu, bấm
            - strong [ref=f5e171]: Tải file Markdown
            - text: để lấy bản hướng dẫn đầy đủ về contract, bảo mật, kiểm thử và vận hành.
          - listitem [ref=f5e172]:
            - strong [ref=f5e173]: "Sao chép endpoint:"
            - text: các thanh endpoint có nút Sao chép; sau khi sao chép, trang thông báo trạng thái để người dùng bàn phím và trình đọc màn hình cũng biết kết quả.
          - listitem [ref=f5e174]:
            - strong [ref=f5e175]: "Đổi theme:"
            - text: nút theme đổi giữa giao diện sáng và tối, đồng thời lưu lựa chọn trên thiết bị.
          - listitem [ref=f5e176]:
            - strong [ref=f5e177]: "Dùng trên điện thoại:"
            - text: thanh bên chuyển thành dock/drawer ở màn hình nhỏ; các thao tác chính vẫn giữ nút đủ lớn và có focus khi dùng bàn phím.
        - heading "8. Nếu gặp thông báo lỗi trên web hiện tại" [level=3] [ref=f5e178]
        - generic [ref=f5e179]:
          - generic [ref=f5e180]:
            - strong [ref=f5e181]: Thông báo
            - code [ref=f5e182]: Nguyên nhân thường gặp
            - generic [ref=f5e183]: Cách xử lý
          - generic [ref=f5e184]:
            - strong [ref=f5e185]: Phiên đăng nhập đã hết hạn
            - code [ref=f5e186]: Session hoặc transaction cũ
            - generic [ref=f5e187]: Quay lại website tích hợp và bắt đầu một yêu cầu OAuth mới; không dùng lại tab callback cũ.
          - generic [ref=f5e188]:
            - strong [ref=f5e189]: Thao tác đồng ý không hợp lệ
            - code [ref=f5e190]: Transaction hết hạn hoặc đã dùng
            - generic [ref=f5e191]: Mở lại đường dẫn đăng nhập từ website tích hợp, chọn tài khoản và bấm Tiếp tục một lần.
          - generic [ref=f5e192]:
            - strong [ref=f5e193]: invalid_client
            - code [ref=f5e194]: Client ID/API key sai hoặc project bị tắt
            - generic [ref=f5e195]: Kiểm tra đúng project, trạng thái công tắc và secret server-side; không gửi client_secret.
          - generic [ref=f5e196]:
            - strong [ref=f5e197]: invalid_grant
            - code [ref=f5e198]: Code đã dùng, hết hạn hoặc callback lệch
            - generic [ref=f5e199]: Không retry cùng code. So sánh callback đã đăng ký rồi bắt đầu luồng đăng nhập mới.
          - generic [ref=f5e200]:
            - strong [ref=f5e201]: Danh sách người dùng chưa đổi
            - code [ref=f5e202]: Chưa tới polling hoặc dữ liệu chưa có
            - generic [ref=f5e203]: Bấm Làm mới, kiểm tra đúng project và chờ request hoàn tất trước khi thử lại.
