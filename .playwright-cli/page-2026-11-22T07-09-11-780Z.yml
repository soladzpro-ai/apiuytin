          - listitem [ref=f5e616]: APIUYTIN thử lại truy vấn Sanity tạm thời với giới hạn; mutation không được thử lại mù. Batch dọn dữ liệu dùng tối đa 50 mutation và đồng thời tối đa 6 tác vụ.
          - listitem [ref=f5e617]: Giới hạn đồng thời giảm fan-out nhưng không loại bỏ quota/giới hạn tần suất của Google, Sanity hoặc Cloudflare.
      - generic [ref=f5e618]:
        - heading "Ranh giới bảo mật" [level=2] [ref=f5e619]
        - list [ref=f5e620]:
          - listitem [ref=f5e621]: Đổi code và mọi yêu cầu mang API key chỉ chạy ở máy chủ.
          - listitem [ref=f5e622]: Không đặt API key trong JavaScript trình duyệt, HTML, URL, localStorage, gói ứng dụng di động, analytics hoặc log.
          - listitem [ref=f5e623]: Không ghi authorization header, callback code, access token, cookie hoặc token request body vào log.
          - listitem [ref=f5e624]: Kiểm tra state phía máy chủ và xóa state sau một lần xử lý.
          - listitem [ref=f5e625]: Giới hạn return path về đường dẫn nội bộ để tránh open redirect.
          - listitem [ref=f5e626]: Đặt thời gian chờ cho yêu cầu HTTP và giới hạn kích thước nội dung.
          - listitem [ref=f5e627]: Chỉ lưu các trường hồ sơ cần thiết. Bảo vệ dữ liệu email và avatar theo chính sách riêng của ứng dụng.
          - listitem [ref=f5e628]: Gắn HTTPS cho callback ở mọi môi trường được đăng ký.
          - listitem [ref=f5e629]: Không cố tạo luồng vô hạn để né rate limit của upstream.
