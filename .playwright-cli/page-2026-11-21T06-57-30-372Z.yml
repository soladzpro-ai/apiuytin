          - listitem [ref=e87]:
            - strong [ref=e88]: "Thêm tài khoản:"
            - text: Google OAuth chạy để xác thực tài khoản mới, APIUYTIN tạo hoặc cập nhật apiUser, liên kết tài khoản với thiết bị và quay lại màn hình đồng ý.
          - listitem [ref=e89]:
            - strong [ref=e90]: "Thiết bị mới hoặc cookie hết hạn:"
            - text: cần xác thực Google để liên kết tài khoản với thiết bị đó.
          - listitem [ref=e91]:
            - strong [ref=e92]: "Hủy:"
            - text: APIUYTIN redirect về callback với
            - code [ref=e93]: error=access_denied
            - text: và state ban đầu nếu state đã được gửi.
        - paragraph [ref=e94]:
          - text: Cookie thiết bị tên
          - code [ref=e95]: apiuytin_device
          - text: ", có thuộc tính HttpOnly, Secure, SameSite=Lax và thời hạn tối đa 30 ngày. Cookie này chỉ giúp APIUYTIN nhớ tài khoản trên thiết bị; website tích hợp không đọc cookie này."
        - paragraph [ref=e96]: Bộ chọn tài khoản không gửi Google access token hoặc refresh token cho ứng dụng tích hợp. Hồ sơ trả về dùng ID riêng của APIUYTIN.
