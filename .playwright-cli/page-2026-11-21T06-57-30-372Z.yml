        - heading "Tạo state và chuyển hướng người dùng" [level=2] [ref=e68]
        - paragraph [ref=e69]: Tạo state ngẫu nhiên cho từng lần đăng nhập. Lưu state trong phiên phía máy chủ hoặc kho state có TTL ngắn, gắn với phiên trình duyệt hiện tại và xóa ngay khi callback xử lý xong. Không dùng một state cố định cho nhiều người dùng hoặc nhiều tab.
        - code [ref=e71]: "// Tuyến Express chạy trên máy chủ của website tích hợp. import { randomBytes } from \"node:crypto\"; app.get(\"/login/apiuytin\", async (req, res, next) => { try { const state = randomBytes(32).toString(\"base64url\"); req.session.apiuytinStates ||= {}; req.session.apiuytinStates[state] = { createdAt: Date.now(), returnTo: \"/account\" }; // Bảo đảm session đã được lưu trước khi rời website. await new Promise((resolve, reject) => { req.session.save((error) => error ? reject(error) : resolve()); }); const loginUrl = new URL(\"https://apiuytin.pages.dev/oauth/google\"); loginUrl.searchParams.set(\"client_id\", process.env.APIUYTIN_CLIENT_ID); loginUrl.searchParams.set( \"redirect_uri\", \"https://app.example.com/auth/apiuytin/callback\" ); loginUrl.searchParams.set(\"state\", state); res.redirect(302, loginUrl.toString()); } catch (error) { next(error); } });"
        - paragraph [ref=e72]: "Ba tham số truy vấn được gửi tới APIUYTIN:"
        - list [ref=e73]:
