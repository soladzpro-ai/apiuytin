        - list [ref=e292]:
          - listitem [ref=e293]: Không retry lỗi 4xx mà không đổi input hoặc trạng thái.
          - listitem [ref=e294]: Không thử lại mù POST token bằng cùng code sau khi hết thời gian chờ; authorization code là code dùng một lần.
          - listitem [ref=e295]: Không thử lại thao tác tạo mới, cấp lại hoặc thu hồi vô hạn. Nếu kết quả không rõ, truy vấn trạng thái phù hợp rồi quyết định bước tiếp theo.
          - listitem [ref=e296]: APIUYTIN thử lại truy vấn Sanity tạm thời với giới hạn; mutation không được thử lại mù. Batch dọn dữ liệu dùng tối đa 50 mutation và đồng thời tối đa 6 tác vụ.
          - listitem [ref=e297]: Giới hạn đồng thời giảm fan-out nhưng không loại bỏ quota/giới hạn tần suất của Google, Sanity hoặc Cloudflare.
      - generic [ref=e298]:
        - heading "Ranh giới bảo mật" [level=2] [ref=e299]
        - list [ref=e300]:
          - listitem [ref=e301]: Đổi code và mọi yêu cầu mang API key chỉ chạy ở máy chủ.
          - listitem [ref=e302]: Không đặt API key trong JavaScript trình duyệt, HTML, URL, localStorage, gói ứng dụng di động, analytics hoặc log.
          - listitem [ref=e303]: Không ghi authorization header, callback code, access token, cookie hoặc token request body vào log.
          - listitem [ref=e304]: Kiểm tra state phía máy chủ và xóa state sau một lần xử lý.
          - listitem [ref=e305]: Giới hạn return path về đường dẫn nội bộ để tránh open redirect.
          - listitem [ref=e306]: Đặt thời gian chờ cho yêu cầu HTTP và giới hạn kích thước nội dung.
          - listitem [ref=e307]: Chỉ lưu các trường hồ sơ cần thiết. Bảo vệ dữ liệu email và avatar theo chính sách riêng của ứng dụng.
          - listitem [ref=e308]: Gắn HTTPS cho callback ở mọi môi trường được đăng ký.
          - listitem [ref=e309]: Không cố tạo luồng vô hạn để né rate limit của upstream.
      - generic [ref=e310]:
        - heading "Kiểm tra trước khi bật đăng nhập" [level=2] [ref=e311]
        - list [ref=e312]:
          - listitem [ref=e313]: Client ID và API key thuộc đúng dự án/môi trường.
          - listitem [ref=e314]: API key chỉ tồn tại trong trình quản lý bí mật phía máy chủ.
          - listitem [ref=e315]: Callback HTTPS khớp chính xác dự án đã đăng ký.
          - listitem [ref=e316]: State được sinh ngẫu nhiên, lưu phía máy chủ, có TTL và dùng một lần.
          - listitem [ref=e317]:
            - text: Đường đi hủy xử lý
            - code [ref=e318]: access_denied
            - text: mà không gọi token endpoint.
          - listitem [ref=e319]:
            - text: "Đổi token gửi đúng bốn trường:"
            - code [ref=e320]: client_id
            - text: ","
            - code [ref=e321]: api_key
            - text: ","
            - code [ref=e322]: code
            - text: ","
            - code [ref=e323]: redirect_uri
            - text: .
          - listitem [ref=e324]: Máy chủ từ chối invalid_client/invalid_grant và không tự tạo phiên khi phản hồi token lỗi.
          - listitem [ref=e325]: Ứng dụng tạo phiên cục bộ từ hồ sơ APIUYTIN, không dùng Google subject làm ID người dùng.
          - listitem [ref=e326]: Nhật ký đã che code, API key, access token, cookie và authorization header.
          - listitem [ref=e327]: Đã thử tài khoản đã nhớ, thiết bị mới, thêm tài khoản, hủy, callback sai và phát lại code.
          - listitem [ref=e328]: Đã thử cấp lại key và xác nhận key cũ bị từ chối.
