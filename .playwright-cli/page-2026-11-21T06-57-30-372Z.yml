          - listitem [ref=e78]:
            - code [ref=e79]: state
            - text: ": nonce do ứng dụng tích hợp sinh và kiểm tra lại ở callback."
        - paragraph [ref=e80]: Không gửi API key, hồ sơ người dùng, access token hoặc dữ liệu bí mật trong URL OAuth.
      - generic [ref=e81]:
        - heading "Người dùng chọn tài khoản và đồng ý" [level=2] [ref=e82]
        - paragraph [ref=e83]: APIUYTIN xác thực dự án và callback, tạo transaction ngắn hạn, rồi mở bộ chọn trên cùng origin. Bộ chọn hiển thị tên dự án, domain callback, các tài khoản đã liên kết với thiết bị, avatar, tên, email và mô tả dữ liệu sẽ chia sẻ.
        - list [ref=e84]:
